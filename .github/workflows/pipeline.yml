name: Pipeline CI/CD - Laboratorio 3

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilación, Pruebas Unitarias y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Etapa 1 - Compilación del Proyecto
        run: mvn -B compile

      - name: Etapa 2 - Ejecución de Pruebas Unitarias
        run: mvn -B test

      - name: Etapa 3 - Generación de Cobertura con JaCoCo
        run: mvn -B jacoco:report

      - name: Etapa 4 - Publicar Artefacto de Reportes de Pruebas (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

      - name: Etapa 5 - Publicar Artefacto de Cobertura de Código (JaCoCo HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
