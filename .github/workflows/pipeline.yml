# Pipeline CI/CD - Laboratorio 2
name: Pipeline CI/CD - Laboratorio 2

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Ejecución del Pipeline de CI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Mostrar mensaje de bienvenida
        run: |
          echo "=================================================="
          echo " ¡Bienvenido al Pipeline de Integración Continua! "
          echo " Laboratorio 1 - CI/CD Labs                      "
          echo "=================================================="

      - name: Mostrar fecha y hora de ejecución
        run: |
          echo "Fecha y Hora de ejecución (UTC): $(date -u)"
          echo "Timestamp ISO 8601: $(date --iso-8601=seconds)"

      - name: Mostrar versión de Git instalada
        run: |
          echo "Versión de Git en el runner:"
          git --version

      - name: Validar corrección del pipeline de CI
        run: |
          echo "La falla intencional ha sido corregida exitosamente."

      - name: Finalizar ejecución del pipeline
        run: |
          echo "El pipeline ha finalizado correctamente sin errores."
