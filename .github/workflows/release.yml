name: Release Pipeline - Laboratorio 6

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Generar Artefacto JAR
        run: mvn -B clean package -DskipTests

      - name: Identificar Artefacto JAR Generado
        id: find_jar
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          echo "JAR_PATH=$JAR_FILE" >> $GITHUB_ENV
          echo "Artefacto a publicar: $JAR_FILE"

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR_PATH }}
          title: "Release ${{ github.ref_name }}"
          body: "Artefacto ejecutable Spring Boot JAR generado automáticamente por el pipeline de Release de la materia CI/CD."
          draft: false
          prerelease: false
